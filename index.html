<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Assistant</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8edff, #f6edff);
            color: #222;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 50%;
            font-size: 42px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        }

        h1 {
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 34px;
            color: #29245c;
        }

        .subtitle {
            color: #666;
            margin-top: 10px;
            font-size: 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 28px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(70, 60, 130, 0.10);
            border: 1px solid #eeeaff;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #4038a8;
        }

        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #d8d4ff;
            border-radius: 10px;
            font-size: 15px;
            background: white;
            outline: none;
        }

        select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px #e0dfff;
        }

        .skills {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .skill {
            padding: 14px;
            border: 1px solid #ddd9ff;
            border-radius: 10px;
            cursor: pointer;
            background: #fafaff;
            transition: 0.2s;
        }

        .skill:hover {
            background: #f0efff;
            border-color: #8b83f5;
        }

        /* Selected skill highlight */

        .skill:has(input:checked) {
            background: #e8e7ff;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px #c7c5ff;
            color: #4038a8;
            font-weight: bold;
        }

        .experience {
            display: flex;
            gap: 15px;
        }

        .experience label {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd9ff;
            border-radius: 10px;
            cursor: pointer;
            background: #fafaff;
            transition: 0.2s;
        }

        .experience label:hover {
            background: #f0efff;
            border-color: #8b83f5;
        }

        /* Selected experience highlight */

        .experience label:has(input:checked) {
            background: #e8e7ff;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px #c7c5ff;
            color: #4038a8;
            font-weight: bold;
        }

        .generate-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.25);
            transition: 0.2s;
        }

        .generate-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 20px rgba(79, 70, 229, 0.30);
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 25px;
        }

        @media (max-width: 600px) {

            .container {
                margin: 20px auto;
                padding: 12px;
            }

            h1 {
                font-size: 27px;
            }

            .skills {
                grid-template-columns: 1fr;
            }

            .experience {
                flex-direction: column;
            }

            .card {
                padding: 20px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">🤖</div>

        <h1>AI Interview Assistant</h1>

        <p class="subtitle">
            Prepare smarter. Practice better. Crack your interview.
        </p>

    </div>


    <form action="/generate" method="POST">


        <!-- JOB -->

        <div class="card">

            <h2 class="section-title">
                💼 Select Your Job
            </h2>

            <select name="job" required>

                <option value="">
                    Select Job
                </option>

                <option value="Data Analyst">
                    Data Analyst
                </option>

                <option value="Business Analyst">
                    Business Analyst
                </option>

                <option value="Software Developer">
                    Software Developer
                </option>

                <option value="Web Developer">
                    Web Developer
                </option>

            </select>

        </div>


        <!-- SKILLS -->

        <div class="card">

            <h2 class="section-title">
                🛠️ Select Your Skills
            </h2>

            <div class="skills">

                <label class="skill">
                    <input type="checkbox" name="skills" value="Python">
                    Python
                </label>

                <label class="skill">
                    <input type="checkbox" name="skills" value="SQL">
                    SQL
                </label>

                <label class="skill">
                    <input type="checkbox" name="skills" value="Excel">
                    Excel
                </label>

                <label class="skill">
                    <input type="checkbox" name="skills" value="Power BI">
                    Power BI
                </label>

                <label class="skill">
                    <input type="checkbox" name="skills" value="Java">
                    Java
                </label>

                <label class="skill">
                    <input type="checkbox" name="skills" value="HTML/CSS">
                    HTML/CSS
                </label>

            </div>

        </div>


        <!-- EXPERIENCE -->

        <div class="card">

            <h2 class="section-title">
                👤 Select Experience Level
            </h2>

            <div class="experience">

                <label>
                    <input
                        type="radio"
                        name="experience"
                        value="Fresher"
                        required
                    >
                    🎓 Fresher
                </label>

                <label>
                    <input
                        type="radio"
                        name="experience"
                        value="Experienced"
                    >
                    💼 Experienced
                </label>

            </div>

        </div>


        <!-- BUTTON -->

        <div class="card">

            <button
                class="generate-button"
                type="submit"
            >
                🚀 Generate Interview Questions
            </button>

        </div>

    </form>


    <div class="footer">

        AI Interview Assistant • BCA Project

    </div>

</div>

</body>
</html>
